name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
    
    - name: Install dependencies
      run: |
        npm config set registry https://registry.npmjs.org/
        npm config set fetch-retry-mintimeout 20000
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 3
        npm config set audit false
        npm config set fund false
        echo "Cleaning npm cache..."
        npm cache clean --force || echo "Cache clean completed with warnings"
        echo "Installing root dependencies..."
        npm install --no-optional --legacy-peer-deps --maxsockets 1 --no-audit --no-fund --silent || echo "Root install completed with warnings"
        echo "Installing server dependencies..."
        npm install --prefix server --no-optional --legacy-peer-deps --maxsockets 1 --no-audit --no-fund --silent || echo "Server install completed with warnings"
        echo "Installing client dependencies..."
        npm install --prefix client --no-optional --legacy-peer-deps --maxsockets 1 --no-audit --no-fund --silent || echo "Client install completed with warnings"
        echo "Verifying client dependencies..."
        cd client && npm ls ajv || echo "ajv not found, will reinstall"
        cd client && npm install ajv --save-dev || echo "ajv install completed with warnings"
    
    - name: Run backend tests
      run: |
        cd server
        npm test --if-present
    
    - name: Run frontend tests
      run: |
        cd client
        npm test --if-present
    
    - name: Build frontend
      run: |
        cd client
        pwd
        ls -la public/
        echo "Checking src directory structure..."
        ls -la src/
        echo "Checking for App.tsx specifically..."
        ls -la src/App.*
        echo "Checking if App.tsx exists..."
        test -f src/App.tsx && echo "App.tsx exists" || echo "App.tsx NOT FOUND"
        echo "Checking ajv installation..."
        npm ls ajv || echo "ajv not found"
        echo "Reinstalling ajv if needed..."
        npm install ajv@^8.0.0 --save-dev || echo "ajv reinstall completed with warnings"
        echo "Attempting to build..."
        npm run build
    
    - name: Lint backend
      run: |
        cd server
        npm run lint --if-present
    
    - name: Lint frontend
      run: |
        cd client
        npm run lint --if-present

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
    
    - name: Install dependencies
      run: |
        npm config set registry https://registry.npmjs.org/
        npm config set fetch-retry-mintimeout 20000
        npm config set fetch-retry-maxtimeout 120000
        npm config set fetch-retries 3
        npm config set audit false
        npm config set fund false
        echo "Cleaning npm cache..."
        npm cache clean --force || echo "Cache clean completed with warnings"
        echo "Installing root dependencies..."
        npm install --no-optional --legacy-peer-deps --maxsockets 1 --no-audit --no-fund --silent || echo "Root install completed with warnings"
        echo "Installing server dependencies..."
        npm install --prefix server --no-optional --legacy-peer-deps --maxsockets 1 --no-audit --no-fund --silent || echo "Server install completed with warnings"
        echo "Installing client dependencies..."
        npm install --prefix client --no-optional --legacy-peer-deps --maxsockets 1 --no-audit --no-fund --silent || echo "Client install completed with warnings"
        echo "Verifying client dependencies..."
        cd client && npm ls ajv || echo "ajv not found, will reinstall"
        cd client && npm install ajv --save-dev || echo "ajv install completed with warnings"
    
    - name: Build frontend
      run: |
        cd client
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-files
        path: |
          client/build/
          server/
        retention-days: 1

  deploy-preview:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Deploy preview
      run: |
        echo "Deploy preview for PR #${{ github.event.number }}"
        echo "This would deploy to a preview environment"
